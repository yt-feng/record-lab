name: Verify bounded price source census
on:
  workflow_dispatch:
    inputs:
      publish_classification:
        description: Publish the fixed stored-fact classification after verification
        required: false
        default: false
        type: boolean
permissions:
  contents: read
  actions: read
concurrency:
  group: ${{ inputs.publish_classification && 'published-records' || 'verify-price-source-census' }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /lib/
            /config/
            /web/*.js
            /tests/
            /.github/
      - uses: actions/checkout@v4
        with:
          ref: '383e7996dcbe4b6a8ff4535c8f3dc8292abb3bda'
          path: .cache/price-census-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /web/data/periods/2026Q3/latest.json
            /web/data/periods/2026Q3/companies/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate bounded source and fixed proof contracts
        run: |
          node --test tests/test_price_source_census.js tests/test_price_representations_view.js
          python -m unittest discover -s tests -p 'test_verify_price_source_census.py'
          python -m unittest discover -s tests -p 'test_price_representation.py'
          python -m unittest discover -s tests -p 'test_admit_price_representation.py'
      - name: Restore original proof and census current immutable sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/verify_price_source_census.py --data-repo .cache/price-census-source --output .cache/price-source-census
      - name: Retain source-bound diagnostic candidate
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-source-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/price-source-census/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: verify
    if: inputs.publish_classification == true && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: price-source-census-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/price-source-census
      - name: Revalidate fixed proof and stage only independent classification
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/admit_price_representation.py --evidence-dir .cache/price-source-census
      - name: Guard and persist classification with remote readback
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publication_guard.py --root . --history
          python scripts/persist-observations.py
          python scripts/admit_price_representation.py --verify-readback
      - name: Prepare public classification view
        run: python scripts/prepare-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/site
  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
