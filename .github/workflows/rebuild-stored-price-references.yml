name: Rebuild stored price range references
on:
  workflow_dispatch:
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
concurrency:
  group: published-records
  cancel-in-progress: false
env:
  NODE_OPTIONS: --max-old-space-size=5120
jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate observation preservation and current-fact coverage
        run: |
          node --test tests/test_price_range_reference.js tests/test_price_range_reference_reuse.js tests/test_rebuild_stored_price_references.js
          python -m unittest discover -s tests -p 'test_reconcile_stored_quality.py'
      - name: Classify every retained quote without market requests
        run: node scripts/rebuild_stored_price_references.js
      - name: Reconcile quality without changing attempts or unresolved holds
        run: python scripts/reconcile_stored_quality.py
      - name: Rebuild cross-portfolio analysis for both quarters
        run: |
          node scripts/analyze-data.js --data web/data/periods/2026Q2
          node scripts/analyze-data.js --data web/data/periods/2026Q3
      - name: Validate publication and persist derived results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python scripts/publication_guard.py --root . --history
          python scripts/persist-observations.py
          git fetch origin main
          git diff --exit-code HEAD origin/main -- web/data
      - name: Prepare public site
        run: python scripts/prepare-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Retain bounded reclassification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stored-price-reference-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/stored-price-reference/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
