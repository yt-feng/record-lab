name: Resume retained traversal publication
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Completed failed traversal run with all batch artifacts retained
        required: true
        type: string
      source_commit:
        description: Exact source commit of the original traversal
        required: true
        type: string
concurrency:
  group: published-records
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
  pages: write
  id-token: write
env:
  NODE_OPTIONS: --max-old-space-size=5120
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Verify immutable artifact restoration contracts
        run: python -m unittest discover -s tests -p 'test_resume_traversal.py'
      - name: Restore and publish original batch observations
        env:
          GH_TOKEN: ${{ github.token }}
          ORIGINAL_RUN: ${{ inputs.run_id }}
          ORIGINAL_SOURCE: ${{ inputs.source_commit }}
        run: python scripts/resume_traversal.py --run-id "$ORIGINAL_RUN" --source-commit "$ORIGINAL_SOURCE"
      - name: Validate publication history
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/publication_guard.py --root . --history
      - name: Persist verified observations
        run: python scripts/persist-observations.py
      - name: Verify actual remote data and replay marker
        env:
          ORIGINAL_RUN: ${{ inputs.run_id }}
          ORIGINAL_SOURCE: ${{ inputs.source_commit }}
        run: python scripts/resume_traversal.py --run-id "$ORIGINAL_RUN" --source-commit "$ORIGINAL_SOURCE" --verify-persisted
      - name: Prepare public site
        run: python scripts/prepare-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Retain restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: traversal-resumption-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/resume-traversal/result.json
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
