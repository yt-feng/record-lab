name: Recheck bounded security price conflicts
on:
  workflow_dispatch:
    inputs:
      keys_per_quarter:
        description: Maximum securities per quarter; at most two original sources each
        required: true
        default: '1'
        type: choice
        options:
          - '1'
          - '2'
          - '3'
          - '4'
      data_commit:
        description: Published data commit to inspect
        required: true
        type: string
      prior_run_id:
        description: Completed immediately preceding ledger workflow run
        required: true
        type: string
      prior_source_commit:
        description: Exact source commit of that prior run
        required: true
        type: string
      prior_data_commit:
        description: Exact published data commit inspected by that prior run
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: recheck-price-conflicts
  cancel-in-progress: false
jobs:
  recheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /lib/
            /config/
            /web/*.js
            /tests/
            /.github/
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_commit }}
          path: .cache/conflict-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /web/data/periods/2026Q2/latest.json
            /web/data/periods/2026Q2/analysis.json
            /web/data/periods/2026Q2/price-conflict-ledger.json
            /web/data/periods/2026Q2/companies/
            /web/data/periods/2026Q3/latest.json
            /web/data/periods/2026Q3/analysis.json
            /web/data/periods/2026Q3/price-conflict-ledger.json
            /web/data/periods/2026Q3/companies/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate ledger and source-bound requests
        run: |
          node --test tests/test_price_conflict_scan.js tests/test_price_validation_cache.js
          python -m unittest discover -s tests -p 'test_price_conflicts.py'
          python -m unittest discover -s tests -p 'test_price_conflict_limits.py'
          python -m unittest discover -s tests -p 'test_restore_price_conflict_ledger.py'
      - name: Restore explicitly bound prior ledger
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR_RUN_ID: ${{ inputs.prior_run_id }}
          PRIOR_SOURCE_COMMIT: ${{ inputs.prior_source_commit }}
          PRIOR_DATA_COMMIT: ${{ inputs.prior_data_commit }}
          DATA_COMMIT_INPUT: ${{ inputs.data_commit }}
        run: |
          data_sha="$(git -C .cache/conflict-source rev-parse HEAD)"
          if [[ ! "$DATA_COMMIT_INPUT" =~ ^[a-f0-9]{40}$ ]] || [[ "$data_sha" != "$DATA_COMMIT_INPUT" ]]; then
            echo '{"status":"failed","errorCode":"CONFLICT_RESTORE_DATA_MISMATCH"}'
            exit 1
          fi
          python scripts/restore_price_conflict_ledger.py --prior-run-id "$PRIOR_RUN_ID" --prior-source-commit "$PRIOR_SOURCE_COMMIT" --prior-data-commit "$PRIOR_DATA_COMMIT" --data-commit "$data_sha" --output .cache/price-conflicts-restore/state.json
      - name: Scan published conflicts within each quarter limit
        env:
          KEYS_PER_QUARTER: ${{ inputs.keys_per_quarter }}
        run: |
          export PRICE_DIAGNOSTIC_DATA_COMMIT="$(git -C .cache/conflict-source rev-parse HEAD)"
          python scripts/price_conflicts.py run --data .cache/conflict-source/web/data/periods --output .cache/price-conflicts --quarters both --keys-per-quarter "$KEYS_PER_QUARTER" --restore-state .cache/price-conflicts-restore/state.json
      - name: Retain guarded conflict ledger
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-conflict-ledger-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: .cache/price-conflicts/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
