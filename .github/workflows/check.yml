name: Validate records
on:
  push:
    branches: [main]
    paths-ignore: ['web/data/**']
  pull_request:
  workflow_dispatch:
    inputs:
      publish_site:
        description: Republish verified saved observations without collection
        type: boolean
        default: false
concurrency:
  # Manual republication shares the collection writer lock for the whole run.
  group: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_site && github.ref == 'refs/heads/main' && 'published-records' || format('validate-records-{0}', github.run_id) }}
  cancel-in-progress: false
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ubuntu-latest
    # A changed scanner/workflow requires a full historical content scan.
    # Keep every check and allow time to save the verified proof afterward.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Validate publishable commits, not GitHub's synthetic PR merge identity.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_site && github.ref == 'refs/heads/main' && 'main' || github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - run: npm test
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate public site packaging
        run: python scripts/prepare-site.py
      - name: Validate publication history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_CACHE_OUTPUT: ${{ runner.temp }}/publication-history.json
        run: python scripts/publication_guard.py --root . --history
      - name: Save verified publication history
        if: success() && github.ref == 'refs/heads/main' && steps.history.outputs.cache_artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.history.outputs.cache_artifact_name }}
          path: ${{ runner.temp }}/publication-history.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload verified saved site
        if: github.event_name == 'workflow_dispatch' && inputs.publish_site && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/site
  publish:
    needs: check
    if: github.event_name == 'workflow_dispatch' && inputs.publish_site && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - uses: actions/deploy-pages@v4
        id: deployment
