name: Diagnose fixed report retention
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: diagnose-nonstock-retention
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /lib/
            /web/*.js
            /tests/
            /.github/
            /config/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate isolated diagnosis
        run: python -m unittest discover -s tests -p 'test_diagnose_nonstock_retention.py'
      - name: Read fixed prior observation
        uses: actions/download-artifact@v4
        with:
          name: part-1
          run-id: 40790220286
          github-token: ${{ github.token }}
          path: .cache/nonstock-retention-input
      - name: Diagnose two public quarterly PDFs without market requests
        run: python scripts/diagnose_nonstock_retention.py
      - name: Retain bounded diagnostic only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nonstock-retention-diagnosis
          path: .cache/nonstock-retention/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
