name: Traverse records
on:
  workflow_dispatch:
    inputs:
      quarter:
        description: Quarter collection scope
        type: choice
        options: [both, 2026Q2, 2026Q3]
        default: both
      continue_chain:
        description: Continue remaining batches automatically
        type: boolean
        default: true
  schedule:
    - cron: '17 */12 * * *'
concurrency:
  group: published-records
  cancel-in-progress: false
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=5120
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate code
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Plan isolated quarter batches
        id: plan
        env:
          QUARTER: ${{ inputs.quarter || 'both' }}
        run: |
          python scripts/campaign.py plan --quarter "$QUARTER" --shards 16 --batch-size 75
          node scripts/workflow-outputs.js .cache/plan >> "$GITHUB_OUTPUT"
      - run: python scripts/publication_guard.py --root . --plan-dir .cache/plan
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: .cache/plan/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: campaign
          path: .cache/campaign/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: directory
          path: web/data/catalog.json
          if-no-files-found: error
          retention-days: 2
  batch:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /lib/
            /config/
            /tests/
            /.github/
            /web/*.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: .cache/plan
      - name: Collect batch
        id: collect
        continue-on-error: true
        timeout-minutes: 34
        env:
          BATCH_CONFIG: ${{ matrix.config }}
          MINER_U_KEYS: ${{ secrets.MINER_U_KEYS }}
          MINER_U: ${{ secrets.MINER_U }}
          MINERU_API_KEY: ${{ secrets.MINERU_API_KEY }}
        run: |
          AS_OF=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/plan/" + process.env.BATCH_CONFIG)).asOf')
          python scripts/collect.py --config ".cache/plan/$BATCH_CONFIG" --output raw/input.json --as-of "$AS_OF"
      - name: Build batch
        id: build
        if: always()
        continue-on-error: true
        env:
          BATCH_CONFIG: ${{ matrix.config }}
        run: |
          test -f raw/input.json
          node scripts/build-data.js --input raw/input.json --output web/data/part.json --config ".cache/plan/$BATCH_CONFIG"
      - name: Record completion state
        if: always()
        env:
          BATCH_CONFIG: ${{ matrix.config }}
        run: python scripts/traversal.py status --config ".cache/plan/$BATCH_CONFIG" --snapshot web/data/part.json --output web/data/status.json
      - name: Validate batch publication
        if: always()
        id: publication
        run: python scripts/publication_guard.py --root .
      - uses: actions/upload-artifact@v4
        if: always() && steps.publication.outcome == 'success'
        with:
          name: part-${{ matrix.id }}
          path: |
            web/data/part.json
            web/data/status.json
          if-no-files-found: error
          retention-days: 2
  publish:
    needs: [plan, batch]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    # Merge both quarters and allow a full history scan if no verified proof
    # exists yet; subsequent unchanged scanner runs can reuse the proof.
    timeout-minutes: 60
    permissions:
      contents: write
      pages: read
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: directory
          path: web/data
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: .cache/plan
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_work == 'true'
        continue-on-error: true
        with:
          pattern: part-*
          path: .cache/parts
      - uses: actions/download-artifact@v4
        with:
          name: campaign
          path: .cache/campaign
      - name: Merge source-linked results
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_CACHE_OUTPUT: ${{ runner.temp }}/publication-history.json
        run: |
          python scripts/campaign.py publish
          python scripts/publication_guard.py --root . --history
      - name: Save verified publication history
        if: success() && github.ref == 'refs/heads/main' && steps.history.outputs.cache_artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.history.outputs.cache_artifact_name }}
          path: ${{ runner.temp }}/publication-history.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist observations and checkpoint
        run: python scripts/persist-observations.py
      - name: Prepare compressed public site
        run: python scripts/prepare-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/site
      - name: Continue unfinished traversal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTINUE_CHAIN: ${{ github.event_name == 'schedule' || inputs.continue_chain }}
        run: |
          if [ "$CONTINUE_CHAIN" = 'true' ] && [ "$(node -p 'JSON.parse(require("fs").readFileSync(".cache/campaign/result.json")).continueRun')" = 'true' ]; then
            QUARTER=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/campaign/result.json")).selection')
            gh workflow run traverse.yml --ref main -f continue_chain=true -f quarter="$QUARTER"
          fi
  deploy:
    needs: publish
    if: needs.publish.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
