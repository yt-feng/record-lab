name: Traverse records
on:
  workflow_dispatch:
    inputs:
      quarter:
        description: Quarter collection scope
        type: choice
        options: [both, 2026Q2, 2026Q3]
        default: both
      continue_chain:
        description: Continue remaining batches automatically
        type: boolean
        default: true
      source_repair:
        description: Repair report sources without market requests
        type: boolean
        default: false
  schedule:
    - cron: '17 */12 * * *'
concurrency:
  # Only one traversal plans at a time. Source collection may run while an
  # independent recovery publishes; the publish job shares the writer lock.
  group: traversal-records
  cancel-in-progress: false
permissions:
  contents: read
env:
  NODE_OPTIONS: --max-old-space-size=5120
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_work: ${{ steps.plan.outputs.has_work }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate code
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Plan isolated quarter batches
        id: plan
        env:
          QUARTER: ${{ inputs.quarter || 'both' }}
          CAMPAIGN_MARKET_ACCOUNTING: required
          SOURCE_REPAIR: ${{ inputs.source_repair || false }}
        run: |
          ARGS=()
          if [ "$SOURCE_REPAIR" = 'true' ]; then ARGS+=(--source-repair); fi
          # Use the existing 32-job allowance for one quarter, or split it evenly.
          SHARDS=16
          if [ "$QUARTER" != 'both' ]; then SHARDS=32; fi
          python scripts/campaign.py plan --quarter "$QUARTER" --shards "$SHARDS" --batch-size 75 "${ARGS[@]}"
          node scripts/workflow-outputs.js .cache/plan >> "$GITHUB_OUTPUT"
      - run: python scripts/publication_guard.py --root . --plan-dir .cache/plan
      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: .cache/plan/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: campaign
          path: .cache/campaign/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: directory
          path: web/data/catalog.json
          if-no-files-found: error
          retention-days: 14
  batch:
    needs: plan
    if: needs.plan.outputs.has_work == 'true'
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 42
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /lib/
            /config/
            /tests/
            /.github/
            /web/*.js
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: .cache/plan
      - name: Collect batch
        id: collect
        continue-on-error: true
        timeout-minutes: 34
        env:
          BATCH_CONFIG: ${{ matrix.config }}
          RECEIPT_BATCH_ID: ${{ matrix.id }}
          MINER_U_KEYS: ${{ secrets.MINER_U_KEYS }}
          MINER_U: ${{ secrets.MINER_U }}
          MINERU_API_KEY: ${{ secrets.MINERU_API_KEY }}
        run: |
          AS_OF=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/plan/" + process.env.BATCH_CONFIG)).asOf')
          python scripts/collect.py --config ".cache/plan/$BATCH_CONFIG" --output raw/input.json --as-of "$AS_OF" --request-receipts .cache/request-accounting-private
      - name: Validate independent market request accounting
        id: accounting
        if: always()
        env:
          BATCH_CONFIG: ${{ matrix.config }}
          RECEIPT_BATCH_ID: ${{ matrix.id }}
        run: python scripts/request_receipts.py --journal .cache/request-accounting-private --config ".cache/plan/$BATCH_CONFIG" --output .cache/request-accounting-public/receipts.json
      - name: Preserve independently verified market request accounting
        id: accounting_upload
        if: always() && steps.accounting.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: request-accounting-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.id }}
          path: .cache/request-accounting-public/receipts.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Build batch
        id: build
        if: always()
        continue-on-error: true
        env:
          BATCH_CONFIG: ${{ matrix.config }}
        run: |
          test -f raw/input.json
          node scripts/build-data.js --input raw/input.json --output web/data/part.json --config ".cache/plan/$BATCH_CONFIG"
      - name: Record completion state
        id: status
        if: always() && steps.build.outcome == 'success'
        env:
          BATCH_CONFIG: ${{ matrix.config }}
        run: python scripts/traversal.py status --config ".cache/plan/$BATCH_CONFIG" --snapshot web/data/part.json --output web/data/status.json
      - name: Validate batch publication
        if: always()
        id: publication
        run: python scripts/publication_guard.py --root .
      - uses: actions/upload-artifact@v4
        if: always() && steps.build.outcome == 'success' && steps.status.outcome == 'success' && steps.publication.outcome == 'success'
        with:
          name: part-${{ matrix.id }}
          path: |
            web/data/part.json
            web/data/status.json
          if-no-files-found: error
          retention-days: 14
      - name: Preserve technical failure status
        if: always()
        env:
          COLLECT_OUTCOME: ${{ steps.collect.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          STATUS_OUTCOME: ${{ steps.status.outcome }}
          PUBLICATION_OUTCOME: ${{ steps.publication.outcome }}
          ACCOUNTING_OUTCOME: ${{ steps.accounting.outcome }}
          ACCOUNTING_UPLOAD_OUTCOME: ${{ steps.accounting_upload.outcome }}
          ACCOUNTING_COMPLETED: ${{ steps.accounting.outputs.completed }}
        run: |
          python - <<'PY'
          import os
          names = ('COLLECT_OUTCOME', 'BUILD_OUTCOME', 'STATUS_OUTCOME', 'PUBLICATION_OUTCOME', 'ACCOUNTING_OUTCOME', 'ACCOUNTING_UPLOAD_OUTCOME')
          if any(os.environ.get(name) != 'success' for name in names) or os.environ.get('ACCOUNTING_COMPLETED') != 'true':
              print('{"status":"failed","errorCode":"BATCH_STEP_FAILED"}')
              raise SystemExit(1)
          PY
  publish:
    needs: [plan, batch]
    if: always() && needs.plan.result == 'success'
    concurrency:
      group: published-records
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # A measured two-quarter merge exceeded 60 minutes before publication.
    # Include analysis, history validation and deployment in this bound.
    timeout-minutes: 180
    permissions:
      contents: write
      pages: write
      actions: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: directory
          path: web/data
      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: .cache/plan
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.has_work == 'true'
        continue-on-error: true
        with:
          pattern: part-*
          path: .cache/parts
      - uses: actions/download-artifact@v4
        with:
          name: campaign
          path: .cache/campaign
      - name: Restore independent market request accounting
        if: needs.plan.outputs.has_work == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: request-accounting-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: .cache/request-accounting
      - name: Merge source-linked results
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION_CACHE_OUTPUT: ${{ runner.temp }}/publication-history.json
          CAMPAIGN_MARKET_ACCOUNTING: required
        run: |
          python scripts/campaign.py publish
          python scripts/publication_guard.py --root . --history
      - name: Save verified publication history
        if: success() && github.ref == 'refs/heads/main' && steps.history.outputs.cache_artifact_name != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.history.outputs.cache_artifact_name }}
          path: ${{ runner.temp }}/publication-history.json
          if-no-files-found: error
          retention-days: 14
      - name: Persist observations and checkpoint
        run: python scripts/persist-observations.py
      - name: Prepare compressed public site
        run: python scripts/prepare-site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .cache/site
      - name: Deploy verified public observations
        uses: actions/deploy-pages@v4
        id: deployment
      - name: Continue unfinished traversal
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          CONTINUE_CHAIN: ${{ github.event_name == 'schedule' || inputs.continue_chain }}
        run: |
          if [ "$CONTINUE_CHAIN" = 'true' ] && [ "$(node -p 'JSON.parse(require("fs").readFileSync(".cache/campaign/result.json")).continueRun')" = 'true' ]; then
            QUARTER=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/campaign/result.json")).selection')
            SOURCE_REPAIR=$(node -p 'JSON.parse(require("fs").readFileSync(".cache/campaign/result.json")).sourceRepair === true')
            gh workflow run traverse.yml --ref main -f continue_chain=true -f quarter="$QUARTER" -f source_repair="$SOURCE_REPAIR"
          fi
