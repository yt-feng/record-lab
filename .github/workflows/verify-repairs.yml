name: Verify report repairs
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-report-repairs
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /lib/
            /web/*.js
            /tests/
            /.github/
            /config/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate isolated verification code
        run: python -m unittest discover -s tests -p 'test_verify_repairs.py'
      - name: Verify five public PDF sources
        run: python scripts/verify_repairs.py
      - name: Retain compact verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-repair-verification
          path: .cache/repair-verification/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
