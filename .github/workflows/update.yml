name: Update records
on:
  workflow_dispatch:
    inputs:
      quarter:
        description: Quarter collection scope
        type: choice
        options: [both, 2026Q2, 2026Q3]
        default: both
permissions:
  contents: read
  actions: write
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Queue resumable quarter collection
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          QUARTER: ${{ inputs.quarter }}
        run: gh workflow run traverse.yml --ref main -f continue_chain=true -f quarter="$QUARTER"
