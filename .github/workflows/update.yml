name: Update records
on:
  workflow_dispatch:
concurrency:
  group: published-records
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  price-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Check two public price series
        run: python scripts/probe-prices.py
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate source
        run: |
          npm test
          python -m unittest discover -s tests -p 'test_*.py'
          python scripts/publication_guard.py --root . --history
      - name: Collect observations
        timeout-minutes: 32
        continue-on-error: true
        run: python scripts/collect.py --config config/universe.json --output raw/input.json --as-of 2026-09-29
      - name: Build comparisons
        if: always()
        run: |
          test -f raw/input.json
          if [ -f web/data/catalog.json ]; then
            node scripts/build-data.js --input raw/input.json --output .cache/parts/seed/part.json --config config/universe.json
            node scripts/merge-parts.js --parts .cache/parts --data web/data --catalog web/data/catalog.json --config config/universe.json
          else
            node scripts/build-data.js --input raw/input.json --output web/data/latest.json --config config/universe.json --merge-all
          fi
      - name: Validate publication
        run: python scripts/publication_guard.py --root .
      - name: Save validated snapshot
        run: |
          git pull --ff-only origin main
          git config user.name 'Automation'
          git config user.email 'automation@users.noreply.github.com'
          git add web/data
          if ! git diff --staged --quiet; then
            git commit -m 'Update public observations'
            git push origin HEAD:main
          fi
      - name: Summarize coverage
        run: node scripts/summarize.js >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: records
          path: web/data/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish snapshot
        id: deployment
        uses: actions/deploy-pages@v4
