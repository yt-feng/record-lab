name: Diagnose published quote conflicts
on:
  workflow_dispatch:
    inputs:
      data_commit:
        description: Published data commit to inspect
        required: true
        default: 53a62f508fb6a5966a080591a73c6c8fed5f4d3e
        type: string
      refetch:
        description: Requery at most two original sources per sampled key
        required: true
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: verify-price-conflicts
  cancel-in-progress: false
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /*
            !/*/
            /scripts/
            /lib/
            /config/
            /web/*.js
            /tests/
            /.github/
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.data_commit }}
          path: .cache/price-conflict-source
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /web/data/periods/2026Q2/latest.json
            /web/data/periods/2026Q2/analysis.json
            /web/data/periods/2026Q2/companies/
            /web/data/periods/2026Q3/latest.json
            /web/data/periods/2026Q3/analysis.json
            /web/data/periods/2026Q3/companies/
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Validate bounded synthetic diagnostics
        run: |
          node --test tests/test_price_conflict_scan.js
          python -m unittest discover -s tests -p 'test_verify_price_conflicts.py'
      - name: Inspect published quotes without modifying production data
        env:
          PRICE_DIAGNOSTIC_REFETCH: ${{ inputs.refetch }}
        run: |
          export PRICE_DIAGNOSTIC_DATA_COMMIT="$(git -C .cache/price-conflict-source rev-parse HEAD)"
          python scripts/verify_price_conflicts.py --data .cache/price-conflict-source/web/data/periods
      - name: Retain compact diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: price-conflict-diagnostic
          path: .cache/price-conflict-audit/result.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
